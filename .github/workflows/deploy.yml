name: Deploy

# Publishes public/ to https://games.comanta.com.my (Cloudflare Workers static assets)
# whenever the site changes on main. Needs the repository secret CLOUDFLARE_API_TOKEN:
# a Cloudflare token made from the "Edit Cloudflare Workers" template, with the
# comanta.com.my zone. Never add a pull_request trigger: PR code must not see the token.

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.156.2 deploy
